<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a class="brand" href="#/" id="brand" aria-label="Enterprise Copilot home"></a>

      <nav class="nav" id="nav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/" data-scroll="why">Why Copilot</a>

            <a href="#/tasks" data-nav="tasks" role="menuitem">Tasks</a>

  <main id="view" tabindex="-1"></main>

  <footer class="site-footer" id="siteFooter"></footer>

  <button class="to-top" id="toTop" type="button" aria-label="Back to top"></button>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="/static/vendor/marked.min.js"></script>
